[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentops-guard"
version = "0.1.0"
description = "Self-hosted Agent tracing, evaluation, and security gateway for MCP + Python agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.27.0",
  "redis>=5.0.0",
  "rq>=2.0.0",
  "pyyaml>=6.0.2",
  "typer>=0.12.0",
  "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0"
]

[project.scripts]
agentops-guard = "agentops_guard.cli:app"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentops_guard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

