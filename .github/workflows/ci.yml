name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run pytest --cov=agentops_guard --cov-fail-under=80 -q
      - run: AGENTOPS_DATABASE_URL=sqlite:///./ci-migration.sqlite3 uv run alembic upgrade head
      - run: docker compose config --quiet
      - run: uv run python scripts/validate_helm_assets.py
      - run: uv run python scripts/helm_template_check.py
      - run: test -f scripts/compose_smoke.py

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run test
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - run: npm run test:e2e
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
