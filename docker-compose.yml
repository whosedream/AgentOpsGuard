services:
  migration:
    build: .
    command: uv run alembic upgrade head
    environment:
      AGENTOPS_DATABASE_URL: postgresql+psycopg://agentops:agentops@postgres:5432/agentops
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uv run uvicorn agentops_guard.backend.main:app --host 0.0.0.0 --port 8000
    environment:
      AGENTOPS_API_KEY: dev-agentops-key
      AGENTOPS_DATABASE_URL: postgresql+psycopg://agentops:agentops@postgres:5432/agentops
      AGENTOPS_REDIS_URL: redis://redis:6379/0
      AGENTOPS_OPA_URL: http://opa:8181
      AGENTOPS_POLICY_FAIL_MODE: closed_for_high_risk
      AGENTOPS_CREDENTIAL_STORE: ${AGENTOPS_CREDENTIAL_STORE:-fernet}
      AGENTOPS_CREDENTIAL_ENCRYPTION_KEY: ${AGENTOPS_CREDENTIAL_ENCRYPTION_KEY:-}
      AGENTOPS_OPENBAO_URL: ${AGENTOPS_OPENBAO_URL:-}
      AGENTOPS_OPENBAO_TOKEN: ${AGENTOPS_OPENBAO_TOKEN:-}
      AGENTOPS_OPENBAO_KV_MOUNT: ${AGENTOPS_OPENBAO_KV_MOUNT:-secret}
      AGENTOPS_OTEL_ENABLED: "true"
      AGENTOPS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AGENTOPS_OTEL_SERVICE_NAME: agentops-guard-api
    ports:
      - "8000:8000"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    build: .
    command: uv run uvicorn agentops_guard.gateway.app:app --host 0.0.0.0 --port 8001
    environment:
      AGENTOPS_API_KEY: dev-agentops-key
      AGENTOPS_DATABASE_URL: postgresql+psycopg://agentops:agentops@postgres:5432/agentops
      AGENTOPS_REDIS_URL: redis://redis:6379/0
      AGENTOPS_OPA_URL: http://opa:8181
      AGENTOPS_POLICY_FAIL_MODE: closed_for_high_risk
      AGENTOPS_SEMANTIC_SCANNER_MODE: ${AGENTOPS_SEMANTIC_SCANNER_MODE:-disabled}
      AGENTOPS_SEMANTIC_MODEL_PATH: /models/semantic-guard
      AGENTOPS_SEMANTIC_MODEL_SHA256: ${AGENTOPS_SEMANTIC_MODEL_SHA256:-}
      AGENTOPS_SEMANTIC_SCANNER_THRESHOLD: ${AGENTOPS_SEMANTIC_SCANNER_THRESHOLD:-0.90}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      AGENTOPS_OTEL_ENABLED: "true"
      AGENTOPS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AGENTOPS_OTEL_SERVICE_NAME: agentops-guard-gateway
    volumes:
      - ${AGENTOPS_SEMANTIC_MODEL_DIR:-./models/semantic-guard}:/models/semantic-guard:ro
    ports:
      - "8001:8001"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/readyz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    command: uv run agentops-guard worker --queue default --with-scheduler
    environment:
      AGENTOPS_API_KEY: dev-agentops-key
      AGENTOPS_DATABASE_URL: postgresql+psycopg://agentops:agentops@postgres:5432/agentops
      AGENTOPS_REDIS_URL: redis://redis:6379/0
      AGENTOPS_OPA_URL: http://opa:8181
      AGENTOPS_POLICY_FAIL_MODE: closed_for_high_risk
      AGENTOPS_OTEL_ENABLED: "true"
      AGENTOPS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AGENTOPS_OTEL_SERVICE_NAME: agentops-guard-worker
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy
      otel-collector:
        condition: service_started

  dashboard:
    image: node:22-bookworm-slim
    working_dir: /app/dashboard
    command: sh -c "npm ci && npm run build && npm start -- --hostname 0.0.0.0"
    environment:
      AGENTOPS_SERVER_API_URL: http://api:8000
      AGENTOPS_SERVER_GATEWAY_URL: http://gateway:8001
      AGENTOPS_SERVER_API_KEY: dev-agentops-key
      NODE_ENV: production
    volumes:
      - .:/app
      - dashboard_node_modules:/app/dashboard/node_modules
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/setup').then((r)=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agentops
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d agentops"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  opa:
    image: ${AGENTOPS_OPA_IMAGE:-openpolicyagent/opa:1.8.0-debug}
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-format=json", "/policies"]
    volumes:
      - ./policies:/policies:ro
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8181/health?bundles=true&plugins=true"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: ${AGENTOPS_OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.136.0}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"

volumes:
  postgres_data:
  dashboard_node_modules:
