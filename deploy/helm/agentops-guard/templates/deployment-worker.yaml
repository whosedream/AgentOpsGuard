apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-guard-worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app: agentops-guard-worker
  template:
    metadata:
      labels:
        app: agentops-guard-worker
    spec:
      serviceAccountName: {{ required "serviceAccounts.worker is required" .Values.serviceAccounts.worker | quote }}
      automountServiceAccountToken: false
      {{- include "agentops-guard.podSecurityContext" . | nindent 6 }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "agentops-guard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["agentops-guard", "worker", "--queue", "default", "--with-scheduler"]
          {{- include "agentops-guard.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: {{ include "agentops-guard.name" . }}-config
          env:
            - name: AGENTOPS_COMPONENT
              value: worker
            - name: AGENTOPS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "runtimeSecret.existingSecret is required" .Values.runtimeSecret.existingSecret | quote }}
                  key: {{ .Values.runtimeSecret.databaseUrlKey | quote }}
            - name: AGENTOPS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.existingSecret | quote }}
                  key: {{ .Values.runtimeSecret.redisUrlKey | quote }}
            {{- if .Values.opa.enabled }}
            - name: AGENTOPS_OPA_URL
              value: "http://{{ include "agentops-guard.name" . }}-opa:8181"
            - name: AGENTOPS_OPA_TIMEOUT_SECONDS
              value: {{ .Values.opa.timeoutSeconds | quote }}
            - name: AGENTOPS_POLICY_FAIL_MODE
              value: {{ .Values.opa.policyFailMode | quote }}
            {{- if .Values.opa.bundle.enabled }}
            - name: AGENTOPS_OPA_EXPECTED_POLICY_REVISION
              value: {{ .Values.opa.bundle.expectedPolicyRevision | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.telemetry.enabled }}
            - name: AGENTOPS_OTEL_ENABLED
              value: "true"
            - name: AGENTOPS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            - name: AGENTOPS_OTEL_SERVICE_NAME
              value: agentops-guard-worker
            - name: AGENTOPS_OTEL_TRACE_SAMPLE_RATIO
              value: {{ .Values.telemetry.traceSampleRatio | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
      volumes:
        - name: temporary-files
          emptyDir: {}
