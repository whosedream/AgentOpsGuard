{{- if and (gt (int .Values.replicaCount.gateway) 1) (ne .Values.gatewayConcurrency.backend "redis") }}
{{- fail "multiple Gateway replicas require gatewayConcurrency.backend=redis" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-guard-gateway
spec:
  replicas: {{ .Values.replicaCount.gateway }}
  selector:
    matchLabels:
      app: agentops-guard-gateway
  template:
    metadata:
      labels:
        app: agentops-guard-gateway
    spec:
      serviceAccountName: {{ required "serviceAccounts.gateway is required" .Values.serviceAccounts.gateway | quote }}
      automountServiceAccountToken: false
      {{- include "agentops-guard.podSecurityContext" . | nindent 6 }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "agentops-guard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "agentops_guard.gateway.app:app", "--host", "0.0.0.0", "--port", "8001"]
          {{- include "agentops-guard.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: {{ include "agentops-guard.name" . }}-config
          env:
            - name: AGENTOPS_COMPONENT
              value: gateway
            - name: AGENTOPS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "runtimeSecret.existingSecret is required" .Values.runtimeSecret.existingSecret | quote }}
                  key: {{ .Values.runtimeSecret.databaseUrlKey | quote }}
            - name: AGENTOPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.existingSecret | quote }}
                  key: {{ .Values.runtimeSecret.apiKeyKey | quote }}
            {{- if eq .Values.gatewayConcurrency.backend "redis" }}
            - name: AGENTOPS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.existingSecret | quote }}
                  key: {{ .Values.runtimeSecret.redisUrlKey | quote }}
            {{- end }}
            - name: AGENTOPS_SEMANTIC_SCANNER_MODE
              value: {{ .Values.semanticScanner.mode | quote }}
            - name: AGENTOPS_SEMANTIC_SCANNER_THRESHOLD
              value: {{ .Values.semanticScanner.threshold | quote }}
            {{- if ne .Values.semanticScanner.mode "disabled" }}
            - name: AGENTOPS_SEMANTIC_SERVICE_URL
              value: "http://{{ include "agentops-guard.name" . }}-semantic-scanner:{{ .Values.service.semanticScannerPort }}"
            - name: AGENTOPS_SEMANTIC_SERVICE_TIMEOUT_SECONDS
              value: {{ .Values.semanticScanner.timeoutSeconds | quote }}
            {{- end }}
            {{- if .Values.opa.enabled }}
            - name: AGENTOPS_OPA_URL
              value: "http://{{ include "agentops-guard.name" . }}-opa:8181"
            - name: AGENTOPS_OPA_TIMEOUT_SECONDS
              value: {{ .Values.opa.timeoutSeconds | quote }}
            - name: AGENTOPS_POLICY_FAIL_MODE
              value: {{ .Values.opa.policyFailMode | quote }}
            {{- if .Values.opa.bundle.enabled }}
            - name: AGENTOPS_OPA_EXPECTED_POLICY_REVISION
              value: {{ .Values.opa.bundle.expectedPolicyRevision | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.telemetry.enabled }}
            - name: AGENTOPS_OTEL_ENABLED
              value: "true"
            - name: AGENTOPS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            - name: AGENTOPS_OTEL_SERVICE_NAME
              value: agentops-guard-gateway
            - name: AGENTOPS_OTEL_TRACE_SAMPLE_RATIO
              value: {{ .Values.telemetry.traceSampleRatio | quote }}
            {{- end }}
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.gateway.readinessPath }}
              port: 8001
          startupProbe:
            httpGet:
              path: {{ .Values.probes.gateway.readinessPath }}
              port: 8001
            periodSeconds: 5
            timeoutSeconds: 15
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.gateway.livenessPath }}
              port: 8001
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
      volumes:
        - name: temporary-files
          emptyDir: {}
