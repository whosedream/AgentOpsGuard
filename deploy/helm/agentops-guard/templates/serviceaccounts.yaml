{{- if .Values.serviceAccounts.create }}
{{- $accounts := list .Values.serviceAccounts.api .Values.serviceAccounts.gateway .Values.serviceAccounts.worker .Values.serviceAccounts.outboxDispatcher .Values.serviceAccounts.dashboard .Values.serviceAccounts.semanticScanner .Values.serviceAccounts.opa .Values.serviceAccounts.migration -}}
{{- range $index, $account := $accounts }}
{{- if not $account -}}
{{- fail "all serviceAccounts names are required when serviceAccounts.create=true" -}}
{{- end }}
{{- if gt $index 0 }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account | quote }}
  labels:
    {{- include "agentops-guard.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
