apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentops-guard.name" . }}-secret
  labels:
    {{- include "agentops-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  AGENTOPS_DATABASE_URL: {{ .Values.env.AGENTOPS_DATABASE_URL | quote }}
  AGENTOPS_REDIS_URL: {{ .Values.env.AGENTOPS_REDIS_URL | quote }}
  AGENTOPS_API_KEY: {{ .Values.env.AGENTOPS_API_KEY | quote }}
  AGENTOPS_OPERATOR_API_KEY: {{ .Values.env.AGENTOPS_OPERATOR_API_KEY | quote }}
