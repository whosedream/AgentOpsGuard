apiVersion: batch/v1
kind: Job
metadata:
  name: agentops-guard-migration
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uv", "run", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "agentops-guard.name" . }}-config
            - secretRef:
                name: {{ include "agentops-guard.name" . }}-secret
