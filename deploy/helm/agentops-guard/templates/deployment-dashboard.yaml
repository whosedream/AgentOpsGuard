apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-guard-dashboard
spec:
  replicas: {{ .Values.replicaCount.dashboard }}
  selector:
    matchLabels:
      app: agentops-guard-dashboard
  template:
    metadata:
      labels:
        app: agentops-guard-dashboard
    spec:
      serviceAccountName: {{ required "serviceAccounts.dashboard is required" .Values.serviceAccounts.dashboard | quote }}
      automountServiceAccountToken: false
      {{- include "agentops-guard.podSecurityContext" . | nindent 6 }}
      {{- if .Values.dashboardImage.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.dashboardImage.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "agentops-guard.dashboardImage" . | quote }}
          imagePullPolicy: {{ .Values.dashboardImage.pullPolicy }}
          {{- include "agentops-guard.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: dashboard-cache
              mountPath: /app/.next/cache
          envFrom:
            - configMapRef:
                name: {{ include "agentops-guard.name" . }}-config
          env:
            - name: AGENTOPS_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "runtimeSecret.existingSecret is required" .Values.runtimeSecret.existingSecret | quote }}
                  key: {{ .Values.runtimeSecret.dashboardApiKeyKey | quote }}
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.dashboard.readinessPath }}
              port: 3000
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.dashboard.livenessPath }}
              port: 3000
          resources:
            {{- toYaml .Values.resources.dashboard | nindent 12 }}
      volumes:
        - name: temporary-files
          emptyDir: {}
        - name: dashboard-cache
          emptyDir: {}
