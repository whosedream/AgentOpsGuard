replicaCount:
  api: 2
  gateway: 2
  worker: 2
  dashboard: 2

gatewayConcurrency:
  backend: redis

networkPolicy:
  enabled: true
  requireExplicitExternalEgress: true

supplyChain:
  requireImageDigests: true
  requireImageSignatures: true

imageVerification:
  enabled: true

credentialStore:
  openbaoAuthMethod: proxy
